<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>WARDOGS Mortar Calculator</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    font-family: Arial, sans-serif;

    background: #111;

    color: #eee;
}


.card {

    width: min(500px, 100%);

    background: #1d1d1d;

    border: 1px solid #444;

    border-radius: 16px;

    padding: 24px;

    box-shadow: 0 12px 35px #0008;
}


h1 {

    margin: 0 0 6px;

    font-size: 25px;
}


.sub {

    color: #aaa;

    margin: 0 0 22px;

    font-size: 14px;
}


.section {

    margin-top: 18px;

    padding-top: 18px;

    border-top: 1px solid #333;
}


textarea {

    width: 100%;

    min-height: 58px;

    resize: vertical;

    padding: 14px;

    margin-top: 9px;

    border-radius: 10px;

    border: 1px solid #555;

    background: #101010;

    color: #fff;

    font-size: 17px;

    font-family: Arial, sans-serif;

    outline: none;
}


textarea:focus {

    border-color: #ddd;
}


.example {

    color: #777;

    font-size: 12px;

    margin-top: 6px;
}


button {

    width: 100%;

    margin-top: 16px;

    padding: 14px;

    border: 0;

    border-radius: 10px;

    background: #eee;

    color: #111;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}


button:hover {

    background: #fff;
}


.result {

    margin-top: 18px;

    padding: 20px;

    border-radius: 12px;

    background: #111;

    text-align: center;

    border: 1px solid #3d3d3d;
}


.result-title {

    color: #aaa;

    font-size: 13px;
}


.distance {

    font-size: 38px;

    font-weight: bold;

    margin: 6px 0 10px;
}


.detail {

    color: #aaa;

    font-size: 13px;

    line-height: 1.7;
}


.credit {

    margin-top: 18px;

    text-align: center;

    color: #777;

    font-size: 12px;
}


.credit strong {

    color: #ccc;
}

</style>

</head>


<body>


<div class="card">


<h1>
🎯 WARDOGS Mortar Calculator
</h1>


<p class="sub">
Paste the complete coordinates directly into each box.
</p>



<!-- YOUR POSITION -->

<div
class="section"
style="margin-top:0;
padding-top:0;
border-top:0;"
>

<strong>
📍 Your Position (A)
</strong>


<textarea
id="positionA"
placeholder="Example: x98.43, y110.38"
></textarea>


<div class="example">

Example:

x98.43, y110.38

</div>

</div>



<!-- TARGET POSITION -->

<div class="section">

<strong>
🎯 Target Position (B)
</strong>


<textarea
id="positionB"
placeholder="Example: x94.53, y109.03"
></textarea>


<div class="example">

Example:

x94.53, y109.03

</div>

</div>



<!-- CALCULATE -->

<button onclick="calculate()">

CALCULATE

</button>



<!-- RESULT -->

<div class="result">


<div class="result-title">

DISTANCE TO TARGET

</div>


<div
class="distance"
id="distance"
>

—

</div>


<div
class="detail"
id="details"
>

Paste both coordinates to calculate.

</div>


</div>



<!-- CREDIT -->

<div class="credit">

Founded by <strong>MajorBruno</strong>

<br>

© 2026 MajorBruno — All Rights Reserved.

</div>


</div>



<script>


/*
==================================================
COORDINATE PARSER
==================================================

Accepts:

x98.43, y110.38

X98.43 Y110.38

98.43, 110.38

98.43 110.38
*/


function parseCoordinates(text) {


    const numbers = text.match(
        /[-+]?\d+(?:\.\d+)?/g
    );


    if (!numbers || numbers.length < 2) {

        return null;

    }


    return {

        x: parseFloat(numbers[0]),

        y: parseFloat(numbers[1])

    };

}



/*
==================================================
CALCULATE DISTANCE
==================================================
*/


function calculate() {


    const aText =
        document.getElementById(
            "positionA"
        ).value;


    const bText =
        document.getElementById(
            "positionB"
        ).value;



    const A =
        parseCoordinates(aText);


    const B =
        parseCoordinates(bText);



    // Check coordinates

    if (!A || !B) {


        document.getElementById(
            "distance"
        ).textContent = "—";


        document.getElementById(
            "details"
        ).textContent =

        "Please enter valid coordinates.";


        return;

    }



    /*
    Difference between coordinates
    */


    const dx = B.x - A.x;

    const dy = B.y - A.y;



    /*
    Calculate straight-line distance
    */


    const coordinateDistance =

        Math.hypot(
            dx,
            dy
        );



    /*
    Convert map units to meters

    1 coordinate unit = 100 meters
    */


    const meters =

        coordinateDistance * 100;



    /*
    Calculate direction
    */


    const angle =

        (

            Math.atan2(
                dx,
                dy
            )

            * 180

            / Math.PI

            + 360

        ) % 360;



    /*
    Display distance
    */


    document.getElementById(
        "distance"
    ).textContent =

        Math.round(meters) + " m";



    /*
    Display details
    */


    document.getElementById(
        "details"
    ).innerHTML =


        `A: X ${A.x.toFixed(2)},
        Y ${A.y.toFixed(2)}

        <br>

        B: X ${B.x.toFixed(2)},
        Y ${B.y.toFixed(2)}

        <br>

        ΔX: ${dx.toFixed(2)}

        &nbsp; | &nbsp;

        ΔY: ${dy.toFixed(2)}

        <br>

        Map distance:
        ${coordinateDistance.toFixed(2)}
        units

        <br>

        Direction:
        ${angle.toFixed(1)}°`;

}



/*
==================================================
AUTOMATIC CALCULATION
==================================================

The calculator updates as you type/paste.
*/


document
.querySelectorAll("textarea")
.forEach(box => {


    box.addEventListener(
        "input",
        calculate
    );


});



/*
==================================================
CTRL + ENTER
==================================================

Allows manual calculation with Ctrl + Enter.
*/


document.addEventListener(
    "keydown",
    function(event) {


        if (
            event.ctrlKey &&
            event.key === "Enter"
        ) {


            calculate();


        }

    }
);

</script>


</body>

</html>
